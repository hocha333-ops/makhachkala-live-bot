name: Retarget VITRANEL Telegram test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retarget-vitranel-test.yml'

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send VITRANEL preview probes through Makhachkala LIVE bot
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(curl --fail-with-body --silent --show-error --max-time 20             -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=makhachkala-live-vercel" | jq -r '.value')"
          test -n "$TOKEN"
          test "$TOKEN" != "null"
          echo "::add-mask::$TOKEN"
          curl --fail-with-body --silent --show-error --max-time 60             -H "Authorization: Bearer ${TOKEN}"             https://project-rugm4.vercel.app/api/test-vitranel-preview
